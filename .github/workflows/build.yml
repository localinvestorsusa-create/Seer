name: Build Seer source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Recorder.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build Recorder.sln --configuration Release --no-restore
